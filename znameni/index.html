<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Четыре знамени — война подписчиков</title>
<style>
:root{--bg:#120d0a;--card:#241a14cc;--txt:#f4ead6;--mut:#c2b29a;--gold:#ffc83a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ttl{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ttl h1{margin:0;font-size:20px;letter-spacing:2px;font-weight:900;text-shadow:0 2px 6px #000}
.ttl h1 small{display:block;font-size:11px;letter-spacing:.5px;color:var(--mut);font-weight:600}
.clock{background:var(--card);padding:6px 10px;border-radius:12px;font-weight:800;backdrop-filter:blur(6px);text-align:right}
.clock small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.facs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fc{background:var(--card);border-radius:12px;padding:6px 8px;backdrop-filter:blur(6px);border-bottom:3px solid var(--c)}
.fc b{display:flex;justify-content:space-between;font-size:13px}.fc .bar{height:5px;background:#ffffff1a;border-radius:9px;margin-top:4px;overflow:hidden}.fc .bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.fc.dead{opacity:.35}
.bot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.bot>*{pointer-events:auto}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;color:#2a1600;background:linear-gradient(180deg,#ffd75a,#f2a81e);box-shadow:0 3px 0 #9a6410;cursor:pointer}
.btn.g{background:var(--card);color:var(--txt);box-shadow:0 3px 0 #000;backdrop-filter:blur(6px)}
.btn:active{transform:translateY(2px)}
#q{border:0;border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt);font-size:14px;width:150px;backdrop-filter:blur(6px)}
#banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:.35s;background:#1a120ce8;border:2px solid var(--c,#ffc83a);border-radius:20px;padding:18px 22px;text-align:center;min-width:280px;max-width:92vw;pointer-events:none;box-shadow:0 10px 40px #000a}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#banner h2{margin:4px 0 2px;font-size:26px}#banner .big{font-size:54px;line-height:1}
#banner ol{text-align:left;margin:10px 0 12px;padding-left:22px;color:var(--mut)}#banner ol b{color:var(--txt)}
.leg{position:fixed;right:10px;bottom:70px;background:var(--card);border-radius:12px;padding:8px 10px;font-size:12px;backdrop-filter:blur(6px);display:none}
@media(min-width:800px){.leg{display:block}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="ttl"><h1>ЧЕТЫРЕ ЗНАМЕНИ<small>война подписчиков · <span id="cnt">0</span> воинов</small></h1><a class="clock" id="clock" href="https://t.me/znameni4_bot" style="color:inherit;text-decoration:none">…</a></div>
  <div class="facs" id="facs"></div>
</div>
<div class="leg">⚔️ Воин · 🛡 Страж · 🔮 Маг · 🏹 Лучник</div>
<div class="bot">
  <input id="q" placeholder="Найди себя: ник" autocomplete="off" autocapitalize="off">
  <button class="btn" id="play">▶ Последняя битва</button>
  <button class="btn g" id="spd">×1</button>
</div>
<div id="banner"></div>

<script type="module">
import { FIELD, FACTIONS, ROLES, FKEYS, RKEYS, createBattle, step, aliveBy, rng, hashStr } from './battle.mjs';
const cv = document.getElementById('cv'), cx = cv.getContext('2d'), $ = id => document.getElementById(id);

// ---------- воины (демо: вымышленные ники; на сайте — подписчики из Instagram) ----------
const SYL = ['ka', 'ri', 'mo', 'na', 'lex', 'vi', 'to', 'sha', 'dim', 'ar', 'ten', 'ola', 'zu', 'kir', 'ma', 'sa', 'ny', 'gor', 'lia', 'vla', 'den', 'po', 'ra', 'ksu'];
function demoRoster(n = 200) { const R = rng(7), out = [];
  for (let i = 0; i < n; i++) { const nick = SYL[R() * 24 | 0] + SYL[R() * 24 | 0] + (R() < .5 ? '_' + (R() * 99 | 0) : (R() < .5 ? '.' + SYL[R() * 24 | 0] : '')); out.push({ nick, f: FKEYS[i % 4], r: RKEYS[R() * 4 | 0], lv: R() < .1 ? 10 + (R() * 20 | 0) : R() * 8 | 0 }); }
  return out; }
const API = 'https://otgwiroxifqtktbipbsu.supabase.co/functions/v1/znameni/api/';
let ROSTER = demoRoster(), LIVE = null, DEMO = true, NEXT = 0;
async function loadState() {
  try { const r = await fetch(API + 'state', { method: 'POST', body: '{}', headers: { 'content-type': 'application/json' } }); const d = await r.json();
    if (d && Array.isArray(d.army) && d.army.length) { ROSTER = d.army; DEMO = false; } LIVE = d.battle || null; NEXT = d.nextBattle || 0; window.__PAST = d.past || []; }
  catch (e) { }
  $('cnt').textContent = ROSTER.length + (DEMO ? ' (демо)' : '');
}

// ---------- фон поля ----------
const bg = document.createElement('canvas'); bg.width = FIELD.w; bg.height = FIELD.h;
(function paintBg() {
  const g = bg.getContext('2d'), R = rng(3);
  const gr = g.createRadialGradient(800, 500, 100, 800, 500, 900); gr.addColorStop(0, '#5f8a3a'); gr.addColorStop(1, '#2f4a1e'); g.fillStyle = gr; g.fillRect(0, 0, FIELD.w, FIELD.h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${R() < .5 ? '40,70,20' : '120,160,70'},${.08 + R() * .1})`; g.beginPath(); g.ellipse(R() * FIELD.w, R() * FIELD.h, 10 + R() * 40, 6 + R() * 20, R() * 3, 0, 7); g.fill(); }
  g.strokeStyle = '#8a6a3a55'; g.lineWidth = 46; g.lineCap = 'round';
  for (const k of FKEYS) { const [x, y] = FACTIONS[k].camp; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo((x + 800) / 2 + (R() - .5) * 160, (y + 500) / 2, 800, 500); g.stroke(); }
  g.fillStyle = '#8a6a3a66'; g.beginPath(); g.arc(800, 500, 110, 0, 7); g.fill();
  for (let i = 0; i < 40; i++) { const x = R() * FIELD.w, y = R() * FIELD.h; if (Math.hypot(x - 800, y - 500) < 260) continue; if (FKEYS.some(k => Math.hypot(x - FACTIONS[k].camp[0], y - FACTIONS[k].camp[1]) < 230)) continue;
    g.fillStyle = '#1f3312'; g.beginPath(); g.arc(x, y + 8, 22, 0, 7); g.fill(); g.fillStyle = '#2f5a20'; g.beginPath(); g.arc(x, y, 22, 0, 7); g.fill(); g.fillStyle = '#4a7a2e'; g.beginPath(); g.arc(x - 6, y - 6, 11, 0, 7); g.fill(); }
  for (let i = 0; i < 30; i++) { g.fillStyle = '#7a7a72'; g.beginPath(); g.ellipse(R() * FIELD.w, R() * FIELD.h, 8 + R() * 10, 6 + R() * 6, 0, 0, 7); g.fill(); }
  for (const k of FKEYS) { const F = FACTIONS[k], [x, y] = F.camp;
    g.fillStyle = F.dark + '55'; g.beginPath(); g.ellipse(x, y, 170, 135, 0, 0, 7); g.fill();
    g.strokeStyle = F.color + 'aa'; g.lineWidth = 4; g.setLineDash([14, 10]); g.beginPath(); g.ellipse(x, y, 170, 135, 0, 0, 7); g.stroke(); g.setLineDash([]);
    for (let t = 0; t < 5; t++) { const a = t / 5 * 6.28 + .3, tx = x + Math.cos(a) * 125, ty = y + Math.sin(a) * 95; g.fillStyle = F.dark; g.beginPath(); g.moveTo(tx, ty - 26); g.lineTo(tx - 22, ty + 12); g.lineTo(tx + 22, ty + 12); g.closePath(); g.fill(); g.fillStyle = F.color; g.beginPath(); g.moveTo(tx, ty - 26); g.lineTo(tx - 6, ty + 12); g.lineTo(tx + 6, ty + 12); g.closePath(); g.fill(); }
  }
})();

// ---------- камера: вписываем поле, на телефоне в портрете поворачиваем ----------
let W, H, DPR, rot, sc, ox, oy;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR;
  rot = H > W * 1.1; const fw = rot ? FIELD.h : FIELD.w, fh = rot ? FIELD.w : FIELD.h;
  const top = 110, bot = 64; sc = Math.min(W / fw, (H - top - bot) / fh) * 0.98; ox = (W - fw * sc) / 2; oy = top + (H - top - bot - fh * sc) / 2;
}
addEventListener('resize', resize); resize();
function toScreen(x, y) { return rot ? [ox + (FIELD.h - y) * sc, oy + x * sc] : [ox + x * sc, oy + y * sc]; }
function worldTransform() { cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.translate(ox, oy); cx.scale(sc, sc); if (rot) { cx.translate(FIELD.h, 0); cx.rotate(Math.PI / 2); } }

// ---------- состояние ----------
let B = null, mode = 'camp', speed = 1, camp = null, fx = [], found = -1, evIdx = 0, ended = false;
function makeCamp() { const R = rng(11); return ROSTER.map((w, i) => { const [x, y] = FACTIONS[w.f].camp, a = R() * 6.28, d = R() * 120; return { ...w, i, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * .8, tx: x, ty: y, face: 1, hp: 1, maxHp: 1, dead: false, wait: R() * 3 }; }); }
camp = makeCamp();
function units() { return mode === 'battle' ? B.units : camp; }

// ---------- отрисовка воина ----------
function drawUnit(u, t) {
  const F = FACTIONS[u.f], big = u.lv >= 10 ? 1.25 : 1, s = 7 * big;
  let [x, y] = [u.x, u.y]; const bob = u.dead ? 0 : Math.sin(t * 8 + u.i) * 1.2;
  if (u.dead) { cx.globalAlpha = .35; cx.strokeStyle = '#2a1a10'; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(x - 5, y - 5); cx.lineTo(x + 5, y + 5); cx.moveTo(x + 5, y - 5); cx.lineTo(x - 5, y + 5); cx.stroke(); cx.globalAlpha = 1; return; }
  cx.fillStyle = '#0005'; cx.beginPath(); cx.ellipse(x, y + s * .9, s, s * .4, 0, 0, 7); cx.fill();
  y += bob;
  if (u.skin === 'gold') { cx.fillStyle = `rgba(255,215,90,${.35 + .2 * Math.sin(t * 5 + u.i)})`; cx.beginPath(); cx.arc(x, y, s + 6, 0, 7); cx.fill(); }
  cx.fillStyle = F.dark; cx.beginPath(); cx.arc(x, y, s + 1.5, 0, 7); cx.fill();
  cx.fillStyle = F.color; cx.beginPath(); cx.arc(x, y, s, 0, 7); cx.fill();
  cx.fillStyle = '#f2c9a0'; cx.beginPath(); cx.arc(x + u.face * 1.5, y - s * .9, s * .55, 0, 7); cx.fill();
  cx.lineWidth = 2; cx.strokeStyle = '#eee';
  const f = u.face;
  if (u.r === 'warrior') { cx.beginPath(); cx.moveTo(x + f * s * .6, y); cx.lineTo(x + f * s * 1.7, y - s * 1.1); cx.stroke(); }
  else if (u.r === 'guard') { cx.fillStyle = '#c9ccd4'; cx.fillRect(x + f * s * .4 - (f < 0 ? s * .9 : 0), y - s * .6, s * .9, s * 1.3); cx.strokeStyle = F.dark; cx.lineWidth = 1.2; cx.strokeRect(x + f * s * .4 - (f < 0 ? s * .9 : 0), y - s * .6, s * .9, s * 1.3); }
  else if (u.r === 'mage') { cx.fillStyle = '#4a2a80'; cx.beginPath(); cx.moveTo(x + f, y - s * 2.3); cx.lineTo(x - s * .7, y - s * 1.1); cx.lineTo(x + s * .7, y - s * 1.1); cx.fill(); cx.strokeStyle = '#8a5a2a'; cx.beginPath(); cx.moveTo(x + f * s, y + s * .5); cx.lineTo(x + f * s, y - s * 1.4); cx.stroke(); cx.fillStyle = '#9af'; cx.beginPath(); cx.arc(x + f * s, y - s * 1.5, 2.2, 0, 7); cx.fill(); }
  else if (u.r === 'archer') { cx.strokeStyle = '#8a5a2a'; cx.beginPath(); cx.arc(x + f * s * .7, y - s * .2, s * .9, f > 0 ? -1.2 : 1.94, f > 0 ? 1.2 : 4.34); cx.stroke(); }
  if (mode === 'battle' && u.hp < u.maxHp) { cx.fillStyle = '#000a'; cx.fillRect(x - 8, y - s * 2.2, 16, 3); cx.fillStyle = u.hp / u.maxHp > .4 ? '#5be07a' : '#ff5a4a'; cx.fillRect(x - 8, y - s * 2.2, 16 * u.hp / u.maxHp, 3); }
  if (u.i === found || u.lv >= 20) {
    cx.save(); if (rot) { cx.translate(x, y); cx.rotate(-Math.PI / 2); cx.translate(-x, -y); }
    cx.font = `700 ${u.i === found ? 13 : 10}px system-ui`; cx.textAlign = 'center'; const label = (u.lv >= 20 ? '★' : '') + u.nick;
    cx.lineWidth = 3; cx.strokeStyle = '#000c'; cx.strokeText(label, x, y - s * 2.6); cx.fillStyle = u.i === found ? '#ffd75a' : '#fff'; cx.fillText(label, x, y - s * 2.6); cx.restore();
  }
  if (u.i === found) { cx.strokeStyle = '#ffd75a'; cx.lineWidth = 2; cx.beginPath(); cx.arc(x, y, s + 6 + Math.sin(t * 6) * 2, 0, 7); cx.stroke(); }
}

// ---------- эффекты ----------
function pushFx(e) {
  const U = B.units;
  if (e.k === 'arrow') fx.push({ k: 'arrow', x0: U[e.a].x, y0: U[e.a].y, x1: U[e.b].x, y1: U[e.b].y, t: 0, d: .22 });
  else if (e.k === 'bolt') fx.push({ k: 'bolt', x0: U[e.a].x, y0: U[e.a].y - 12, x1: e.x, y1: e.y, t: 0, d: .35, c: FACTIONS[U[e.a].f].color });
  else if (e.k === 'hit' && e.c) fx.push({ k: 'num', x: U[e.b].x, y: U[e.b].y - 16, v: e.d, t: 0, d: .8 });
  else if (e.k === 'hit') fx.push({ k: 'spark', x: U[e.b].x, y: U[e.b].y, t: 0, d: .18 });
  else if (e.k === 'die') fx.push({ k: 'poof', x: U[e.b].x, y: U[e.b].y, t: 0, d: .5, c: FACTIONS[U[e.b].f].color });
}
function drawFx(dt) {
  fx = fx.filter(f => (f.t += dt) < f.d);
  for (const f of fx) { const p = f.t / f.d;
    if (f.k === 'arrow') { const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p - Math.sin(p * Math.PI) * 20, a = Math.atan2(f.y1 - f.y0, f.x1 - f.x0); cx.strokeStyle = '#f4ead6'; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(x - Math.cos(a) * 8, y - Math.sin(a) * 8); cx.lineTo(x, y); cx.stroke(); }
    else if (f.k === 'bolt') { const x = f.x0 + (f.x1 - f.x0) * Math.min(1, p * 1.4), y = f.y0 + (f.y1 - f.y0) * Math.min(1, p * 1.4); if (p < .7) { cx.fillStyle = '#ffb040'; cx.beginPath(); cx.arc(x, y, 5, 0, 7); cx.fill(); cx.fillStyle = '#fff6'; cx.beginPath(); cx.arc(x, y, 2.5, 0, 7); cx.fill(); } else { cx.fillStyle = `rgba(255,140,40,${(1 - p) * 2})`; cx.beginPath(); cx.arc(f.x1, f.y1, 34 * (p - .6) * 2.5, 0, 7); cx.fill(); } }
    else if (f.k === 'spark') { cx.fillStyle = `rgba(255,255,220,${1 - p})`; cx.beginPath(); cx.arc(f.x, f.y, 3 + p * 4, 0, 7); cx.fill(); }
    else if (f.k === 'poof') { cx.strokeStyle = f.c; cx.globalAlpha = 1 - p; cx.lineWidth = 2; cx.beginPath(); cx.arc(f.x, f.y, 6 + p * 18, 0, 7); cx.stroke(); cx.globalAlpha = 1; }
    else if (f.k === 'num') { cx.save(); if (rot) { cx.translate(f.x, f.y); cx.rotate(-Math.PI / 2); cx.translate(-f.x, -f.y); } cx.font = '900 13px system-ui'; cx.textAlign = 'center'; cx.lineWidth = 3; cx.strokeStyle = '#000'; cx.strokeText(f.v + '!', f.x, f.y - p * 18); cx.fillStyle = '#ffd75a'; cx.fillText(f.v + '!', f.x, f.y - p * 18); cx.restore(); }
  }
}
function drawBanners(t) {
  for (const k of FKEYS) { const F = FACTIONS[k], [x, y] = F.camp, alive = mode !== 'battle' || B.units.some(u => !u.dead && u.f === k);
    cx.strokeStyle = '#4a3420'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(x, y + 20); cx.lineTo(x, y - 70); cx.stroke();
    const wv = Math.sin(t * 3 + x) * 4; cx.fillStyle = alive ? F.color : '#555'; cx.beginPath(); cx.moveTo(x, y - 70); cx.lineTo(x + 50, y - 64 + wv); cx.lineTo(x + 50, y - 30 + wv); cx.lineTo(x + 25, y - 38 + wv / 2); cx.lineTo(x, y - 30); cx.fill();
    cx.save(); cx.translate(x + 24, y - 51); if (rot) cx.rotate(-Math.PI / 2); cx.font = '20px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(F.icon, 0, 0); cx.restore(); }
}

// ---------- лагерь (между битвами) ----------
function campStep(dt) { const R = Math.random; for (const u of camp) { u.wait -= dt; if (u.wait <= 0) { const [x, y] = FACTIONS[u.f].camp, a = R() * 6.28, d = R() * 120; u.tx = x + Math.cos(a) * d; u.ty = y + Math.sin(a) * d * .8; u.wait = 2 + R() * 4; }
  const dx = u.tx - u.x, dy = u.ty - u.y, d = Math.hypot(dx, dy); if (d > 2) { u.x += dx / d * 18 * dt; u.y += dy / d * 18 * dt; u.face = dx > 0 ? 1 : -1; } } }

// ---------- HUD ----------
function renderFacs() {
  const c = mode === 'battle' ? aliveBy(B) : Object.fromEntries(FKEYS.map(k => [k, ROSTER.filter(w => w.f === k).length])); const tot = Object.fromEntries(FKEYS.map(k => [k, ROSTER.filter(w => w.f === k).length]));
  $('facs').innerHTML = FKEYS.map(k => `<div class="fc ${c[k] ? '' : 'dead'}" style="--c:${FACTIONS[k].color}"><b><span>${FACTIONS[k].icon} ${FACTIONS[k].name}</span><span>${c[k]}</span></b><div class="bar"><i style="width:${100 * c[k] / Math.max(1, tot[k])}%"></i></div></div>`).join('');
}
function nextBattle() { if (NEXT) return Math.max(0, NEXT - Date.now()); const n = new Date(), t = new Date(n); t.setHours(20, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1); return t - n; }
function renderClock() {
  if (mode === 'battle') { $('clock').innerHTML = `⚔️ ИДЁТ БИТВА<small>${Math.floor(B.time)} сек · скорость ×${speed}</small>`; return; }
  const ms = nextBattle(), h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  $('clock').innerHTML = `Битва в 20:00<small>через ${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</small>`;
}
function showWinner() {
  const F = FACTIONS[B.winner], mvp = [...B.units].sort((a, b) => b.kills - a.kills || b.dmg - a.dmg).slice(0, 5);
  const el = $('banner'); el.style.setProperty('--c', F.color);
  el.innerHTML = `<div class="big">${F.icon}</div><h2 style="color:${F.color}">Победили ${F.name}!</h2><div style="color:var(--mut)">Каждый воин знамени получает +100 золота в @znameni4_bot</div>
  <ol>${mvp.map(u => `<li><b>${u.nick}</b> — ${ROLES[u.r].icon} ${FACTIONS[u.f].icon} ${u.kills} убийств</li>`).join('')}</ol><button class="btn" id="close">В лагерь</button>`;
  el.classList.add('on'); $('close').onclick = () => { el.classList.remove('on'); mode = 'camp'; camp = makeCamp(); fx = []; renderFacs(); };
}

// ---------- кнопки ----------
function startBattle(warriors, seed, skipSec = 0) { $('banner').classList.remove('on'); B = createBattle(warriors, seed); let k = 0; while (k < skipSec / .05 && !B.over) { step(B, .05); k++; } mode = 'battle'; fx = []; evIdx = B.events.length; ended = false; renderFacs(); }
$('play').onclick = () => { if (LIVE) startBattle(LIVE.warriors, LIVE.seed); else startBattle(ROSTER, (Date.now() / 864e5 | 0)); };
// битва идёт прямо сейчас — подключаемся с нужной секунды
async function checkLive() { await loadState(); camp = makeCamp(); renderFacs();
  if (LIVE && mode !== 'battle') { const since = (Date.now() - LIVE.at) / 1000; if (since >= 0 && since < LIVE.result.time + 5) startBattle(LIVE.warriors, LIVE.seed, since); } }
setInterval(() => { if (mode !== 'battle' && NEXT && Date.now() >= NEXT && Date.now() - NEXT < 60000) { NEXT = 0; checkLive(); } }, 2000);
$('spd').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('spd').textContent = '×' + speed; };
$('q').oninput = () => { const q = $('q').value.trim().toLowerCase().replace(/^@/, ''); found = q ? ROSTER.findIndex(w => w.nick.toLowerCase().startsWith(q)) : -1; };

// ---------- цикл ----------
let last = performance.now(), acc = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  if (mode === 'battle') { acc += dt * speed; while (acc >= .05 && !B.over) { step(B, .05); acc -= .05; } if (B.over) acc = 0;
    for (; evIdx < B.events.length; evIdx++) pushFx(B.events[evIdx]); if (B.events.length > 4000) { B.events.splice(0, evIdx); evIdx = 0; }
    if (B.over && !ended) { ended = true; setTimeout(showWinner, 900); } }
  else campStep(dt);
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#120d0a'; cx.fillRect(0, 0, cv.width, cv.height);
  worldTransform(); cx.drawImage(bg, 0, 0); drawBanners(t);
  const us = units(); for (const u of us) if (u.dead) drawUnit(u, t);
  const live = us.filter(u => !u.dead).sort((a, b) => a.y - b.y); for (const u of live) drawUnit(u, t);
  drawFx(dt * speed);
  if ((hudT += dt) > .25) { hudT = 0; renderClock(); if (mode === 'battle') renderFacs(); }
  requestAnimationFrame(frame);
}
renderFacs(); renderClock(); requestAnimationFrame(frame); checkLive();
