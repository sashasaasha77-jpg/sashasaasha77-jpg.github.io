<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c1024;color:var(--txt);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}

<script type="module">
import * as THREE from '../three.module.js';
import { mergeGeometries } from '../lib/BufferGeometryUtils.js';
import { FIELD, FACTIONS, ROLES, FKEYS, RKEYS, createBattle, step, aliveBy, rng, runToEnd } from './battle.mjs';
const $ = id => document.getElementById(id);
const SC = 1 / 20, WX = x => (x - FIELD.w / 2) * SC, WZ = y => (y - FIELD.h / 2) * SC;

// ---------- воины (демо — вымышленные ники; на сайте — подписчики из Instagram) ----------
const SYL = ['ka', 'ri', 'mo', 'na', 'lex', 'vi', 'to', 'sha', 'dim', 'ar', 'ten', 'ola', 'zu', 'kir', 'ma', 'sa', 'ny', 'gor', 'lia', 'vla', 'den', 'po', 'ra', 'ksu'];
function demoRoster(n = 400) { const R = rng(7), out = [];
  for (let i = 0; i < n; i++) { const nick = SYL[R() * 24 | 0] + SYL[R() * 24 | 0] + (R() < .5 ? '_' + (R() * 99 | 0) : (R() < .5 ? '.' + SYL[R() * 24 | 0] : '')); out.push({ nick, f: FKEYS[i % 4], r: RKEYS[R() * 4 | 0], lv: R() < .1 ? 10 + (R() * 20 | 0) : R() * 9 | 0, skin: R() < .03 ? 'gold' : '' }); }
  return out; }
const API = 'https://otgwiroxifqtktbipbsu.supabase.co/functions/v1/znameni/api/';
let ROSTER = demoRoster(), LIVE = null, DEMO = true, NEXT = 0;
async function loadState() {
  try { const r = await fetch(API + 'state', { method: 'POST', body: '{}', headers: { 'content-type': 'application/json' } }); const d = await r.json();
    if (d && Array.isArray(d.army) && d.army.length) { ROSTER = d.army; DEMO = false; } LIVE = d.battle || null; NEXT = d.nextBattle || 0; }

}

// ---------- сцена ----------
const R3 = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); R3.setPixelRatio(Math.min(2, devicePixelRatio || 1));
R3.shadowMap.enabled = true; R3.shadowMap.type = THREE.PCFSoftShadowMap; R3.outputColorSpace = THREE.SRGBColorSpace; $('gl').appendChild(R3.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ab0dc); scene.fog = new THREE.Fog(0x9ab0dc, 70, 150);
const cam = new THREE.PerspectiveCamera(45, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x8a8aa0, 1.6));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(-30, 50, 25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 45, bottom: -45, far: 160 }); sun.shadow.bias = -.0006; scene.add(sun);
const L = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
const hexOf = s => new THREE.Color(s).getHex();

// земля: снег, утоптанная арена, тропы к лагерям
const gtex = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 640; const g = c.getContext('2d'), R = rng(3), k = 1024 / FIELD.w;
  g.fillStyle = '#e4ebf6'; g.fillRect(0, 0, 1024, 640); for (let i = 0; i < 2500; i++) { g.fillStyle = R() < .5 ? '#d2dcec' : '#f6f9ff'; g.beginPath(); g.arc(R() * 1024, R() * 640, 2 + R() * 7, 0, 7); g.fill(); }
  g.strokeStyle = '#b8a58c'; g.lineCap = 'round'; for (const f of FKEYS) { const [x, y] = FACTIONS[f].camp; g.lineWidth = 44; g.beginPath(); g.moveTo(x * k, y * k); g.quadraticCurveTo((x + 800) / 2 * k + (R() - .5) * 90, 320, 512, 320); g.stroke(); }
  const gr = g.createRadialGradient(512, 320, 40, 512, 320, 330); gr.addColorStop(0, '#a88a68'); gr.addColorStop(.75, '#b8a080'); gr.addColorStop(1, '#b8a08000'); g.fillStyle = gr; g.beginPath(); g.ellipse(512, 320, 380, 250, 0, 0, 7); g.fill();
  for (let i = 0; i < 900; i++) { const a = R() * 6.28, d = R() * 280; g.fillStyle = R() < .5 ? '#9a7a58' : '#c4ac8c'; g.beginPath(); g.ellipse(512 + Math.cos(a) * d * 1.3, 320 + Math.sin(a) * d * .8, 3 + R() * 9, 2 + R() * 4, R() * 3, 0, 7); g.fill(); }
  for (const f of FKEYS) { const [x, y] = FACTIONS[f].camp; g.fillStyle = FACTIONS[f].color + '40'; g.beginPath(); g.ellipse(x * k, y * k, 175 * k, 140 * k, 0, 0, 7); g.fill(); g.strokeStyle = FACTIONS[f].color + 'aa'; g.lineWidth = 4; g.setLineDash([16, 10]); g.stroke(); g.setLineDash([]); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; })();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(FIELD.w * SC, FIELD.h * SC), new THREE.MeshLambertMaterial({ map: gtex })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const snowOut = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), L(0xe8eef8)); snowOut.rotation.x = -Math.PI / 2; snowOut.position.y = -.02; snowOut.receiveShadow = true; scene.add(snowOut);
const fires = [], flags = [];
// ели и камни вокруг поля
(function decor() { const R = rng(5), pines = [];
  for (let i = 0; i < 160; i++) { const a = R() * 6.28, rx = 44 + R() * 30, rz = 30 + R() * 25, x = Math.cos(a) * rx, z = Math.sin(a) * rz; pines.push([x, z, .9 + R() * .9]); }
  const trunkG = new THREE.CylinderGeometry(.18, .26, 1.2, 6).translate(0, .6, 0), coneG = new THREE.ConeGeometry(1.3, 2.4, 7).translate(0, 2.2, 0), cone2 = new THREE.ConeGeometry(.95, 1.9, 7).translate(0, 3.4, 0), capG = new THREE.ConeGeometry(.6, .9, 7).translate(0, 4.2, 0);
  const parts = [[trunkG, 0x5a3a22], [coneG, 0x24543f], [cone2, 0x2a6048], [capG, 0xf2f6fc]], m4 = new THREE.Matrix4();
  for (const [geo, col] of parts) { const im = new THREE.InstancedMesh(geo, L(col), pines.length); pines.forEach(([x, z, s], i) => im.setMatrixAt(i, m4.compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)))); im.castShadow = true; scene.add(im); }
  const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.6), L(0x8a90a0), 40);
  for (let i = 0; i < 40; i++) { const x = (R() - .5) * 78, z = (R() - .5) * 48; rock.setMatrixAt(i, m4.compose(new THREE.Vector3(x, .15, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(R(), R(), R())), new THREE.Vector3(.5 + R(), .4 + R() * .5, .5 + R()))); }
  rock.castShadow = true; rock.receiveShadow = true; scene.add(rock);
  // лагеря: шатры, костры, знамёна
  for (const f of FKEYS) { const F = FACTIONS[f], [cx, cy] = F.camp, X = WX(cx), Z = WZ(cy), col = hexOf(F.color), dark = hexOf(F.dark);
    const out = Math.sign(X) * 5.5, outz = Math.sign(Z) * 4.5;
    for (const [dx, dz] of [[out, 0], [0, outz], [out * .8, outz * .9]]) { const t = new THREE.Group();
      const w = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.5, 1.1, 10), L(col)); w.position.y = .55; t.add(w);
      const r = new THREE.Mesh(new THREE.ConeGeometry(1.75, 1.5, 10), L(dark)); r.position.y = 1.85; t.add(r);
      const d = new THREE.Mesh(new THREE.BoxGeometry(.6, .8, .05), L(0x2a1a10)); d.position.set(0, .4, 1.48); t.add(d);
      t.position.set(X + dx, 0, Z + dz); t.lookAt(X, 0, Z); t.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(t); }
    const fire = new THREE.Group(); for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.DodecahedronGeometry(.18), L(0x7a7a84)); s.position.set(Math.cos(i) * .45, .08, Math.sin(i) * .45); fire.add(s); }
    const fl = new THREE.Mesh(new THREE.ConeGeometry(.3, .8, 7), new THREE.MeshBasicMaterial({ color: 0xff8a2a })); fl.position.y = .4; fire.add(fl); fires.push(fl);
    fire.position.set(X + out * .45, 0, Z + outz * .45); scene.add(fire);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 5, 6), L(0x5a3a22)); pole.position.set(X, 2.5, Z); pole.castShadow = true; scene.add(pole);
    const fc = document.createElement('canvas'); fc.width = 128; fc.height = 96; const g = fc.getContext('2d'); g.fillStyle = F.color; g.fillRect(0, 0, 128, 96); g.fillStyle = F.dark; g.fillRect(0, 84, 128, 12);
    g.font = '58px system-ui,"Apple Color Emoji","Segoe UI Emoji"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(F.icon, 64, 44);
    const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.5, 8, 2).translate(1, 0, 0), new THREE.MeshLambertMaterial({ map: ft, side: THREE.DoubleSide })); flag.position.set(X + .07, 4.2, Z); flag.castShadow = true; scene.add(flag); flags.push(flag); }
})();

// ---------- бойцы из блоков: по две «пачки» на роль (без цвета и в цвет знамени) ----------
function bx(arr, w, h, d, x, y, z, col, rx = 0, rz = 0) { const g = new THREE.BoxGeometry(w, h, d); if (rx || rz) g.rotateX(rx).rotateZ(rz); g.translate(x, y, z); const c = new THREE.Color(col), n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; } g.setAttribute('color', new THREE.BufferAttribute(a, 3)); arr.push(g); }
const SKIN = 0xf0c49a, METAL = 0xb8c0cc, METD = 0x6e7682, PANTS = 0x3a3048, BOOT = 0x4a3020, WOOD = 0x6a4424, WHITE = 0xffffff, TINT2 = 0xb0b0b0;
function soldierGeo(role) {
  const n = [], t = [];
  for (const s of [-1, 1]) { bx(n, .14, .4, .16, s * .09, .26, 0, PANTS); bx(n, .16, .12, .2, s * .09, .06, .02, BOOT); }
  bx(t, .4, .42, .24, 0, .66, 0, WHITE); bx(n, .42, .06, .26, 0, .48, 0, WOOD); bx(n, .28, .28, .26, 0, 1.02, 0, SKIN); bx(n, .05, .04, .02, -.06, 1.04, .135, 0x222222); bx(n, .05, .04, .02, .06, 1.04, .135, 0x222222);
  bx(t, .36, .62, .03, 0, .6, -.15, TINT2); // плащ
  for (const s of [-1, 1]) bx(role === 'warrior' || role === 'guard' ? n : t, .12, .42, .14, s * .27, .66, .02, role === 'warrior' || role === 'guard' ? METAL : WHITE);
  if (role === 'warrior') { bx(n, .32, .14, .3, 0, 1.18, 0, METAL); bx(t, .05, .2, .24, 0, 1.33, -.02, WHITE); bx(n, .05, .62, .04, .3, .98, .14, 0xe6eaf0); bx(n, .18, .04, .06, .3, .7, .14, 0xe8b931); bx(t, .05, .36, .3, -.36, .64, .06, WHITE); }
  if (role === 'guard') { bx(n, .32, .34, .32, 0, 1.05, 0, METAL); bx(n, .24, .03, .02, 0, 1.06, .165, 0x15151a); bx(t, .06, .62, .42, -.36, .62, .08, WHITE); bx(n, .07, .64, .06, -.36, .62, .3, 0xe8b931); bx(n, .05, .5, .05, .3, .72, .16, WOOD); bx(n, .14, .14, .14, .3, .98, .16, METD); }
  if (role === 'mage') { bx(t, .44, .04, .44, 0, 1.17, 0, TINT2); bx(t, .26, .22, .26, 0, 1.3, 0, WHITE); bx(t, .14, .16, .14, -.03, 1.47, -.03, WHITE, 0, .3); bx(n, .05, 1.2, .05, .32, .72, .14, WOOD); bx(n, .15, .15, .15, .32, 1.36, .14, 0xffb040); bx(n, .2, .12, .04, 0, .93, .14, 0xe8e8ee); }
  if (role === 'archer') { bx(t, .32, .3, .32, 0, 1.07, -.02, TINT2); bx(t, .26, .2, .16, 0, .96, -.2, TINT2, -.4); bx(n, .04, .8, .04, -.33, .74, .2, WOOD); bx(n, .01, .76, .01, -.27, .74, .2, 0xeeeeee); bx(n, .12, .42, .12, .14, .78, -.2, WOOD, 0, -.35); }
  return [mergeGeometries(n), mergeGeometries(t)];
}
const MAT = new THREE.MeshLambertMaterial({ vertexColors: true });
let MESH = {}, SLOT = [];   // MESH[role] = [neutral, tinted]; SLOT[i] = [role, idx]
function buildArmy(list) {
  for (const r of RKEYS) if (MESH[r]) MESH[r].forEach(m => { scene.remove(m); m.dispose(); });
  MESH = {}; SLOT = []; const cnt = Object.fromEntries(RKEYS.map(r => [r, 0]));
  list.forEach((w, i) => { SLOT[i] = [w.r, cnt[w.r]++]; });
  for (const r of RKEYS) { const [gn, gt] = soldierGeo(r), N = Math.max(1, cnt[r]);
    const mn = new THREE.InstancedMesh(gn, MAT, N), mt = new THREE.InstancedMesh(gt, MAT, N); mn.count = mt.count = cnt[r];
    for (const m of [mn, mt]) { m.castShadow = true; m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); }
    MESH[r] = [mn, mt]; }
  const c = new THREE.Color(); list.forEach((w, i) => { const [r, k] = SLOT[i]; MESH[r][0].setColorAt(k, c.set(w.skin === 'gold' ? 0xffe08a : 0xffffff)); MESH[r][1].setColorAt(k, c.set(w.skin === 'gold' ? 0xffd75a : FACTIONS[w.f].color)); });
  for (const r of RKEYS) MESH[r].forEach(m => { if (m.instanceColor) m.instanceColor.needsUpdate = true; });
}

// ---------- состояние ----------
let B = null, mode = 'camp', speed = 1, paused = false, camp = null, found = -1, follow = -1, evIdx = 0, ended = false, TOTAL = 240, CUR = null;
const anim = []; // на бойца: атака, ранение, смерть, плавная позиция
function makeCamp() { const R = rng(11); return ROSTER.map((w, i) => { const [x, y] = FACTIONS[w.f].camp, a = R() * 6.28, d = R() * 120; return { ...w, i, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * .8, tx: x, ty: y, wait: R() * 4, dead: false, target: -1 }; }); }
function units() { return mode === 'battle' ? B.units : camp; }
function resetAnim(list) { anim.length = 0; for (const u of list) anim.push({ px: u.x, py: u.y, yaw: 0, atk: 9, hurt: 0, die: u.dead ? 1 : 0 }); }
function campStep(dt) { const R = Math.random; for (const u of camp) { u.wait -= dt; if (u.wait <= 0) { const [x, y] = FACTIONS[u.f].camp, a = R() * 6.28, d = R() * 120; u.tx = x + Math.cos(a) * d; u.ty = y + Math.sin(a) * d * .8; u.wait = 2 + R() * 4; }
  const dx = u.tx - u.x, dy = u.ty - u.y, d = Math.hypot(dx, dy); if (d > 2) { u.x += dx / d * 18 * dt; u.y += dy / d * 18 * dt; } } }

// ---------- эффекты ----------
const FX = [], arrowG = new THREE.BoxGeometry(.04, .04, .6), ballG = new THREE.SphereGeometry(.16, 10, 8), ringG = new THREE.RingGeometry(.3, .45, 20).rotateX(-Math.PI / 2), sparkG = new THREE.OctahedronGeometry(.12);
function u3(u, h = .8) { return new THREE.Vector3(WX(u.x), h, WZ(u.y)); }
function pushFx(e) {
  const U = B.units, a = anim[e.a];
  if (e.k === 'hit' || e.k === 'bolt' || e.k === 'arrow') if (a) a.atk = 0;
  if (e.k === 'arrow') { const m = new THREE.Mesh(arrowG, L(0xf0e8d8)); scene.add(m); FX.push({ m, k: 'proj', from: u3(U[e.a], 1), to: u3(U[e.b], .8), t: 0, d: .25, arc: 1.2 }); }
  else if (e.k === 'bolt') { const m = new THREE.Mesh(ballG, new THREE.MeshBasicMaterial({ color: 0xffb040 })); scene.add(m); FX.push({ m, k: 'proj', from: u3(U[e.a], 1.3), to: new THREE.Vector3(WX(e.x), .6, WZ(e.y)), t: 0, d: .35, arc: .6, boom: hexOf(FACTIONS[U[e.a].f].color) }); }
  else if (e.k === 'hit') { const b = anim[e.b]; if (b) b.hurt = 1; if (FX.length < 260) { const m = new THREE.Mesh(sparkG, new THREE.MeshBasicMaterial({ color: e.c ? 0xffe06a : 0xffffff, transparent: true })); m.position.copy(u3(U[e.b], .9)); scene.add(m); FX.push({ m, k: 'spark', t: 0, d: .2 }); }
    if (e.c && (e.b === follow || e.a === follow || e.b === found || e.a === found || Math.random() < .08)) crit(U[e.b], e.d); }
  else if (e.k === 'die') { const m = new THREE.Mesh(ringG, new THREE.MeshBasicMaterial({ color: hexOf(FACTIONS[U[e.b].f].color), transparent: true, side: THREE.DoubleSide })); m.position.copy(u3(U[e.b], .05)); scene.add(m); FX.push({ m, k: 'ring', t: 0, d: .6 }); }
}
function stepFx(dt) {
  for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.t += dt; const p = Math.min(1, f.t / f.d);
    if (f.k === 'proj') { f.m.position.lerpVectors(f.from, f.to, p); f.m.position.y += Math.sin(p * Math.PI) * f.arc; f.m.lookAt(f.to); if (p >= 1 && f.boom) { f.m.material.color.setHex(f.boom); f.k = 'boom'; f.t = 0; f.d = .3; continue; } }
    else if (f.k === 'boom') { f.m.scale.setScalar(1 + p * 5); f.m.material.transparent = true; f.m.material.opacity = 1 - p; }
    else if (f.k === 'spark') { f.m.scale.setScalar(1 + p * 2); f.m.material.opacity = 1 - p; }
    else if (f.k === 'ring') { f.m.scale.setScalar(1 + p * 3); f.m.material.opacity = 1 - p; }
    if (f.t >= f.d && f.k !== 'boom' || f.k === 'boom' && p >= 1) { scene.remove(f.m); if (f.m.material !== MAT) f.m.material.dispose(); FX.splice(i, 1); } }
}
const critEls = [];
function crit(u, d) { const e = document.createElement('div'); e.className = 'lbl crit'; e.textContent = d + '!'; $('labels').appendChild(e); critEls.push({ e, p: u3(u, 1.6), t: 0 }); }

// ---------- камера: свободный полёт / режиссёр / слежка ----------
const camS = { tx: 0, tz: 0, yaw: 0, pitch: .9, dist: 62 }, camT = { ...camS };
let camMode = 'free', dirT = 0;
function applyCam(dt) {
  const k = 1 - Math.pow(.02, dt); for (const p in camS) camS[p] += (camT[p] - camS[p]) * k;
  const h = Math.sin(camS.pitch) * camS.dist, r = Math.cos(camS.pitch) * camS.dist;
  cam.position.set(camS.tx + Math.sin(camS.yaw) * r, h, camS.tz + Math.cos(camS.yaw) * r); cam.lookAt(camS.tx, 0, camS.tz);
}
function setCam(m) { camMode = m; $('cFree').classList.toggle('on', m === 'free'); $('cDir').classList.toggle('on', m === 'dir'); dirT = 0; if (m === 'free' && follow < 0) Object.assign(camT, homeCam()); }
const homeCam = () => innerHeight > innerWidth ? { tx: 0, tz: 0, pitch: 1.05, dist: 105, yaw: Math.PI / 2 } : { tx: 0, tz: 0, pitch: .9, dist: 62, yaw: 0 };
function director(dt) {
  dirT -= dt; camT.yaw += dt * .08; if (dirT > 0) return; dirT = 7;
  const us = units().filter(u => !u.dead); if (!us.length) return;
  const busy = us.filter(u => u.target >= 0 && Math.hypot(units()[u.target].x - u.x, units()[u.target].y - u.y) < 60), u = (busy.length ? busy : us)[Math.random() * (busy.length || us.length) | 0];
  const yaw = Math.atan2(WX(u.x), WZ(u.y)) + (Math.random() - .5) * 1.2; // смотрим от края поля к центру — шатры остаются за спиной камеры
  Object.assign(camT, { tx: WX(u.x), tz: WZ(u.y), pitch: .55 + Math.random() * .3, dist: 13 + Math.random() * 9, yaw: yaw + Math.PI });
}
// управление мышью и пальцами
const ptr = new Map(); let pinch0 = 0, dist0 = 0, moved = 0;
R3.domElement.addEventListener('pointerdown', e => { ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = camT.dist; } });
addEventListener('pointermove', e => { const p = ptr.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y); camT.dist = Math.max(5, Math.min(110, dist0 * pinch0 / Math.max(20, d))); return; }
  if (camMode === 'dir') setCam('free');
  if (e.buttons === 2 || e.shiftKey) { const s = camT.dist / 600; camT.tx -= (dx * Math.cos(camS.yaw) + dy * Math.sin(camS.yaw)) * s; camT.tz -= (-dx * Math.sin(camS.yaw) + dy * Math.cos(camS.yaw)) * s; }
  else { camT.yaw -= dx * .006; camT.pitch = Math.max(.15, Math.min(1.45, camT.pitch + dy * .004)); } });
addEventListener('pointerup', e => { const p = ptr.get(e.pointerId); ptr.delete(e.pointerId); if (p && moved < 8 && e.target === R3.domElement) pick(e.clientX, e.clientY); });
addEventListener('pointercancel', e => ptr.delete(e.pointerId));
R3.domElement.addEventListener('wheel', e => { e.preventDefault(); camT.dist = Math.max(5, Math.min(110, camT.dist * (1 + Math.sign(e.deltaY) * .12))); }, { passive: false });
R3.domElement.addEventListener('contextmenu', e => e.preventDefault());
const ray = new THREE.Raycaster();
function pick(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), cam);
  const meshes = RKEYS.flatMap(r => MESH[r] || []), hit = ray.intersectObjects(meshes, false)[0]; if (!hit) return;
  const r = RKEYS.find(k => MESH[k] && MESH[k].includes(hit.object)), i = SLOT.findIndex(s => s[0] === r && s[1] === hit.instanceId); if (i >= 0) setFollow(i);
}
function setFollow(i) { follow = i; const u = units()[i]; if (i < 0) { $('follow').style.display = 'none'; return; }
  $('follow').style.display = 'flex'; $('fname').innerHTML = `${FACTIONS[u.f].icon} <b>${u.nick}</b> · ${ROLES[u.r].icon} ${ROLES[u.r].name} · ур. ${u.lv || 0}`; setCam('free'); camT.dist = 9; camT.pitch = .45; }
$('unf').onclick = () => { setFollow(-1); setCam('free'); };
$('cFree').onclick = () => setCam('free'); $('cDir').onclick = () => { setFollow(-1); setCam('dir'); };

// ---------- обновление бойцов ----------
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(0, 0, 0, 'YXZ'), v3 = new THREE.Vector3(), sv = new THREE.Vector3();
function updateArmy(dt, t) {
  const us = units();
  for (let i = 0; i < us.length; i++) { const u = us[i], A = anim[i], sl = SLOT[i]; if (!A || !sl) continue;
    const k = 1 - Math.pow(.0005, dt); A.px += (u.x - A.px) * k; A.py += (u.y - A.py) * k;
    let tx, ty; if (u.target >= 0 && us[u.target]) { tx = us[u.target].x; ty = us[u.target].y; } else if (mode === 'camp') { tx = u.tx; ty = u.ty; }
    if (tx != null && Math.hypot(tx - A.px, ty - A.py) > 1) { const want = Math.atan2(tx - A.px, ty - A.py); let d = want - A.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); A.yaw += d * Math.min(1, dt * 8); }
    A.atk += dt * speed; A.hurt = Math.max(0, A.hurt - dt * 5); if (u.dead) A.die = Math.min(1, A.die + dt * 3 * speed);
    const lunge = A.atk < .3 ? Math.sin(A.atk / .3 * Math.PI) : 0, big = u.lv >= 20 ? 1.25 : u.lv >= 10 ? 1.12 : 1, walk = mode === 'camp' || (u.target >= 0 && !lunge) ? Math.abs(Math.sin(t * 9 + i)) * .06 : 0;
    e3.set(-A.die * Math.PI / 2 + lunge * .35 - A.hurt * .25, A.yaw, Math.sin(t * 9 + i) * walk * .6);
    v3.set(WX(A.px) + Math.sin(A.yaw) * lunge * .25, (u.dead ? -.05 * A.die : walk) , WZ(A.py) + Math.cos(A.yaw) * lunge * .25);
    sv.setScalar(big * (u.dead ? 1 - A.die * .15 : 1)); m4.compose(v3, q.setFromEuler(e3), sv);
    MESH[sl[0]][0].setMatrixAt(sl[1], m4); MESH[sl[0]][1].setMatrixAt(sl[1], m4); }
  for (const r of RKEYS) MESH[r].forEach(m => m.instanceMatrix.needsUpdate = true);
  if (follow >= 0 && us[follow]) { const A = anim[follow]; camT.tx = WX(A.px); camT.tz = WZ(A.py); }
}
// подписи: я, найденный, сильнейшие
const lblPool = [];
function labels() {
  const us = units(), want = [];
  if (found >= 0) want.push([found, 'me']); if (follow >= 0 && follow !== found) want.push([follow, 'me']);
  for (const u of us) { if (want.length > 24) break; if (!u.dead && u.lv >= 20 && u.i !== found) want.push([u.i, '']); }
  while (lblPool.length < want.length) { const e = document.createElement('div'); e.className = 'lbl'; $('labels').appendChild(e); lblPool.push(e); }
  lblPool.forEach((e, j) => { const w = want[j]; if (!w) { e.style.display = 'none'; return; } const u = us[w[0]], A = anim[w[0]]; v3.set(WX(A.px), 1.9 * (u.lv >= 20 ? 1.25 : 1), WZ(A.py)).project(cam);
    if (v3.z > 1) { e.style.display = 'none'; return; } e.style.display = ''; e.className = 'lbl ' + w[1]; e.textContent = (u.lv >= 20 ? '★ ' : '') + (u.dead ? '💀 ' : '') + u.nick;
    e.style.left = (v3.x + 1) / 2 * innerWidth + 'px'; e.style.top = (1 - v3.y) / 2 * innerHeight + 'px'; });
  for (let i = critEls.length - 1; i >= 0; i--) { const c = critEls[i]; c.t += .016; c.p.y += .02; v3.copy(c.p).project(cam); c.e.style.left = (v3.x + 1) / 2 * innerWidth + 'px'; c.e.style.top = (1 - v3.y) / 2 * innerHeight + 'px'; c.e.style.opacity = 1 - c.t / .9; if (c.t > .9) { c.e.remove(); critEls.splice(i, 1); } }
}

// ---------- HUD ----------
const tot = () => Object.fromEntries(FKEYS.map(k => [k, ROSTER.filter(w => w.f === k).length]));
function renderFacs() {
  const T = tot(), c = mode === 'battle' ? aliveBy(B) : T;
  $('facs').innerHTML = FKEYS.map(k => `<div class="fc glass ${c[k] ? '' : 'dead'}" style="--c:${FACTIONS[k].color}"><b><span>${FACTIONS[k].icon} ${FACTIONS[k].name}</span><small>${c[k]}/${T[k]}</small></b><div class="bar"><i style="width:${100 * c[k] / Math.max(1, T[k])}%"></i></div></div>`).join('');
}
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function nextBattle() { if (NEXT) return Math.max(0, NEXT - Date.now()); const n = new Date(), t = new Date(n); t.setHours(20, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1); return t - n; }
function renderCard() {
  if (mode === 'battle') { $('card').innerHTML = `<span class="chip">${CUR && CUR.live ? '🔴 ПРЯМОЙ ЭФИР' : 'ЗАПИСЬ БИТВЫ'}</span><div><b>Встречное сражение</b><small>Остаться последним знаменем на поле</small></div><span class="tm">${mmss(B.time)} / ${mmss(TOTAL)}</span>`;
    if (!$('seek').matches(':active')) $('seek').value = Math.floor(B.time); return; }
  const ms = nextBattle(), h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  $('card').innerHTML = `<span class="chip">ЛАГЕРЬ</span><div><b>Битва знамён в 20:00</b><small>Армии готовятся · победившее знамя получит +100 золота</small></div><span class="tm">${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</span>`;
}
function showWinner() {
  const F = FACTIONS[B.winner], mvp = [...B.units].sort((a, b) => b.kills - a.kills || b.dmg - a.dmg).slice(0, 5), el = $('banner'); el.style.setProperty('--c', F.color);
  el.innerHTML = `<div class="big">${F.icon}</div><h2 style="color:${F.color}">Победили ${F.name}!</h2><div style="color:var(--mut)">Каждый воин знамени получает +100 золота в @znameni4_bot</div>
  <ol>${mvp.map(u => `<li><b>${u.nick}</b> — ${ROLES[u.r].icon} ${FACTIONS[u.f].icon} ${u.kills} убийств</li>`).join('')}</ol><button class="btn" id="close">В лагерь</button>`;
  el.classList.add('on'); $('close').onclick = () => { el.classList.remove('on'); toCamp(); };
}
function toCamp() { mode = 'camp'; camp = makeCamp(); buildArmy(camp); resetAnim(camp); $('tl').style.display = 'none'; $('play').style.display = ''; renderFacs(); }

// ---------- запуск битвы и перемотка ----------
function startBattle(warriors, seed, skipSec = 0, live = false) {
  $('banner').classList.remove('on'); CUR = { warriors, seed, live };
  B = createBattle(warriors, seed); let k = 0; while (k < skipSec / .05 && !B.over) { step(B, .05); k++; }
  mode = 'battle'; evIdx = B.events.length; ended = false; buildArmy(B.units); resetAnim(B.units); FX.forEach(f => scene.remove(f.m)); FX.length = 0;
  $('tl').style.display = ''; $('play').style.display = 'none'; $('seek').max = TOTAL; renderFacs(); if (camMode === 'free' && follow < 0) setCam('dir');
}
function playBattle() {
  if (LIVE) { TOTAL = LIVE.result ? LIVE.result.time : 240; startBattle(LIVE.warriors, LIVE.seed, 0); }
  else { const seed = (Date.now() / 864e5 | 0); TOTAL = runToEnd(ROSTER, seed).time; startBattle(ROSTER, seed); }
}
$('play').onclick = playBattle;
$('seek').oninput = () => { if (CUR) startBattle(CUR.warriors, CUR.seed, +$('seek').value, CUR.live); };
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶' : '❚❚'; };
$('spd').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('spd').textContent = '×' + speed; };
$('q').oninput = () => { const q = $('q').value.trim().toLowerCase().replace(/^@/, ''); found = q ? ROSTER.findIndex(w => w.nick.toLowerCase().startsWith(q)) : -1; if (found >= 0) setFollow(found); };
async function checkLive() { await loadState(); toCamp();
  if (LIVE) { const since = (Date.now() - LIVE.at) / 1000; TOTAL = LIVE.result ? LIVE.result.time : 240; if (since >= 0 && since < TOTAL + 5) startBattle(LIVE.warriors, LIVE.seed, since, true); } }
setInterval(() => { if (mode !== 'battle' && NEXT && Date.now() >= NEXT && Date.now() - NEXT < 60000) { NEXT = 0; checkLive(); } }, 2000);

// ---------- цикл ----------
function resize() { R3.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.fov = innerWidth < innerHeight ? 60 : 45; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); Object.assign(camS, homeCam()); Object.assign(camT, homeCam());
let last = performance.now(), acc = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  if (mode === 'battle') { if (!paused) { acc += dt * speed; while (acc >= .05 && !B.over) { step(B, .05); acc -= .05; } if (B.over) acc = 0; }
    for (; evIdx < B.events.length; evIdx++) pushFx(B.events[evIdx]); if (B.events.length > 5000) { B.events.splice(0, evIdx); evIdx = 0; }
    if (B.over && !ended) { ended = true; setTimeout(showWinner, 1200); } }
  else campStep(dt);
  if (MESH.warrior) updateArmy(paused && mode === 'battle' ? 0 : dt, t);
  stepFx(paused ? 0 : dt * speed);
  fires.forEach((f, i) => { const s = 1 + Math.sin(t * 13 + i) * .15; f.scale.set(1 / s, s, 1 / s); });
  flags.forEach(fm => { const pa = fm.geometry.attributes.position; for (let i = 0; i < pa.count; i++) pa.setZ(i, Math.sin(t * 3 + pa.getX(i) * 2) * .12 * pa.getX(i)); pa.needsUpdate = true; });
  if (camMode === 'dir') director(dt); applyCam(dt);
  R3.render(scene, cam); labels();
  if ((hudT += dt) > .25) { hudT = 0; renderCard(); if (mode === 'battle') renderFacs(); }
  requestAnimationFrame(frame);
}
$('load').style.display = 'none';
renderFacs(); renderCard(); toCamp(); requestAnimationFrame(frame); checkLive();
</script>
